<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamma Releases</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:#09051b}
body{overflow-x:hidden;background:
radial-gradient(circle at 20% 10%,rgba(113,59,255,.35),transparent 35%),
radial-gradient(circle at 85% 80%,rgba(0,126,255,.25),transparent 35%),
linear-gradient(135deg,#09051b,#171052 45%,#071c3d)}
#particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.p{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(180,170,255,.65);box-shadow:0 0 12px rgba(130,100,255,.8);animation:float linear infinite}
@keyframes float{0%{transform:translate3d(0,110vh,0);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translate3d(50px,-10vh,0);opacity:0}}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#09051b;transition:.5s}
.loader{width:54px;height:54px;border:5px solid rgba(255,255,255,.15);border-top-color:#8b5cff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading.hide{opacity:0;pointer-events:none}
header{position:sticky;top:0;z-index:10;margin:14px auto;padding:12px 16px;max-width:1100px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(20,14,55,.65);backdrop-filter:blur(18px)}
.logo{font-weight:800;font-size:21px;white-space:nowrap}
.logo span{color:#9d73ff}
.search{flex:1;padding:11px 14px;border:1px solid rgba(255,255,255,.12);border-radius:12px;outline:none;background:rgba(255,255,255,.08);color:#fff}
button{border:0;border-radius:12px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,#7148ff,#377dff);cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.1)}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:25px 16px 60px}
.hero{padding:35px 5px 25px}
.hero h1{font-size:clamp(34px,7vw,64px);margin:0 0 10px;background:linear-gradient(90deg,#fff,#a989ff,#62b5ff);-webkit-background-clip:text;color:transparent}
.hero p{color:#bbb8d0;max-width:650px;font-size:17px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0 25px}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.065);backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.card h3{margin:0 0 7px;font-size:20px}
.meta{font-size:13px;color:#aaa7c2;margin-bottom:12px}
.desc{color:#d3d0df;line-height:1.45;min-height:42px}
.card-actions{display:flex;gap:8px;margin-top:15px}
.account{margin-left:auto}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.65)}
.modal.show{display:flex}
.modal-box{width:min(500px,100%);padding:22px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:#151033;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.modal-box h2{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:#0e0a25;color:#fff;outline:none}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hidden{display:none!important}
.close{float:right;background:rgba(255,255,255,.1)}
.empty{text-align:center;color:#aaa;padding:50px 10px}
.music{position:fixed;right:18px;bottom:18px;z-index:15;border-radius:50%;width:52px;height:52px;padding:0}
footer{text-align:center;color:#77738f;margin-top:50px;font-size:13px}
@media(max-width:650px){
header{margin:8px;padding:10px;flex-wrap:wrap}
.logo{width:100%}.search{order:3;flex-basis:100%}
.account{margin-left:0}
.hero{padding-top:20px}
.card{padding:15px}
}
</style>
</head>
<body>

<div id="particles"></div>

<div id="loading">
  <div class="loader"></div>
  <div style="margin-top:15px;color:#aaa">Загрузка Gamma Releases...</div>
</div>

<header>
  <div class="logo"><span>Gamma</span> Releases</div>
  <input id="search" class="search" placeholder="Поиск APK...">
  <button onclick="openAccount()">Аккаунт</button>
</header>

<main>
  <section class="hero">
    <h1>Gamma Releases</h1>
    <p>Место для публикации и скачивания APK-релизов Gamma Launcher.</p>
  </section>

  <div class="toolbar">
    <button class="chip" onclick="setCategory('all')">Все</button>
    <button class="chip" onclick="setCategory('launcher')">Launcher</button>
    <button class="chip" onclick="setCategory('client')">Client</button>
    <button class="chip" onclick="setCategory('other')">Другое</button>
    <button id="publishBtn" class="hidden" onclick="openPublish()">＋ Опубликовать APK</button>
  </div>

  <section id="releases" class="grid">
    <div class="empty">Загрузка релизов...</div>
  </section>

  <footer>Gamma Releases • APK Distribution</footer>
</main>

<button id="musicBtn" class="music" onclick="toggleMusic()">♫</button>

<div id="accountModal" class="modal" onclick="outsideClose(event,'accountModal')">
  <div class="modal-box">
    <button class="close" onclick="closeModal('accountModal')">✕</button>
    <h2>Аккаунт</h2>
    <div id="accountContent">Загрузка...</div>
  </div>
</div>

<div id="publishModal" class="modal" onclick="outsideClose(event,'publishModal')">
  <div class="modal-box">
    <button class="close" onclick="closeModal('publishModal')">✕</button>
    <h2>Опубликовать APK</h2>
    <form id="publishForm">
      <input name="title" placeholder="Название" required>
      <input name="version" placeholder="Версия, например 1.0.0" required>
      <select name="category">
        <option value="launcher">Launcher</option>
        <option value="client">Client</option>
        <option value="other">Другое</option>
      </select>
      <textarea name="description" placeholder="Описание"></textarea>
      <input name="apk" type="file" accept=".apk" required>
      <button type="submit">Опубликовать</button>
    </form>
    <div id="publishStatus" style="margin-top:10px"></div>
  </div>
</div>

<audio id="relaxMusic" src="relax.mp3" loop preload="auto"></audio>

<script>
const releasesEl=document.getElementById('releases');
const searchEl=document.getElementById('search');
const music=document.getElementById('relaxMusic');
let releases=[];
let category='all';

for(let i=0;i<65;i++){
  const p=document.createElement('div');
  p.className='p';
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=(8+Math.random()*15)+'s';
  p.style.animationDelay=(-Math.random()*20)+'s';
  p.style.width=p.style.height=(2+Math.random()*5)+'px';
  document.getElementById('particles').appendChild(p);
}

window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loading').classList.add('hide'),500);
  loadMe();
  loadReleases();
});

async function loadMe(){
  try{
    const r=await fetch('/api/me');
    const data=await r.json();
    if(data.publisher) document.getElementById('publishBtn').classList.remove('hidden');
    renderAccount(data);
  }catch(e){}
}

async function loadReleases(){
  try{
    const r=await fetch('/api/releases');
    releases=await r.json();
    renderReleases();
  }catch(e){
    releasesEl.innerHTML='<div class="empty">Не удалось загрузить релизы.</div>';
  }
}

function renderReleases(){
  const q=searchEl.value.toLowerCase().trim();
  const list=releases.filter(x=>{
    const matchesCategory=category==='all'||x.category===category;
    const text=(x.title+' '+x.version+' '+(x.description||'')+' '+(x.author||'')).toLowerCase();
    return matchesCategory&&text.includes(q);
  });
  if(!list.length){
    releasesEl.innerHTML='<div class="empty">Релизов пока нет.</div>';
    return;
  }
  releasesEl.innerHTML=list.map(x=>`
    <article class="card">
      <h3>${esc(x.title)}</h3>
      <div class="meta">v${esc(x.version)} • ${esc(x.category||'other')} • ${esc(x.author||'')}</div>
      <div class="desc">${esc(x.description||'Без описания')}</div>
      <div class="card-actions">
        <button onclick="downloadRelease(${x.id})">Скачать APK</button>
      </div>
    </article>
  `).join('');
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function downloadRelease(id){
  location.href='/download/'+id;
}

searchEl.addEventListener('input',renderReleases);

function setCategory(c){
  category=c;
  renderReleases();
}

function openAccount(){
  document.getElementById('accountModal').classList.add('show');
  loadMe();
}

function renderAccount(data){
  const el=document.getElementById('accountContent');
  if(!data.user){
    el.innerHTML=`
      <p>Вы не вошли в аккаунт.</p>
      <button onclick="loginTelegram()">Войти через Telegram</button>
      <button onclick="location.href='/auth/discord'" style="margin-top:8px">Войти через Discord</button>
    `;
    return;
  }
  el.innerHTML=`
    <p>Вы вошли как <b>@${esc(data.user.username||'user')}</b></p>
    <p style="color:#aaa">Провайдер: ${esc(data.user.provider)}</p>
    ${data.publisher?'<p style="color:#9d73ff">✓ Доступна публикация APK</p>':''}
    <button onclick="logout()">Выйти</button>
  `;
}

function loginTelegram(){
  alert('Для настоящего входа через Telegram нужно подключить Telegram Login Widget и указать username бота.');
}

async function logout(){
  await fetch('/auth/logout',{method:'POST'});
  location.reload();
}

function openPublish(){
  document.getElementById('publishModal').classList.add('show');
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

function outsideClose(e,id){
  if(e.target.id===id) closeModal(id);
}

document.getElementById('publishForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const status=document.getElementById('publishStatus');
  status.textContent='Загрузка APK...';
  const form=new FormData(e.target);
  try{
    const r=await fetch('/api/releases',{method:'POST',body:form});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Ошибка');
    status.textContent='Готово! Релиз опубликован.';
    e.target.reset();
    await loadReleases();
  }catch(err){
    status.textContent='Ошибка: '+err.message;
  }
});

async function toggleMusic(){
  if(music.paused){
    try{
      await music.play();
      document.getElementById('musicBtn').textContent='🔊';
    }catch(e){
      alert('Положи файл relax.mp3 рядом с index.html.');
    }
  }else{
    music.pause();
    document.getElementById('musicBtn').textContent='♫';
  }
}
</script>
</body>
</html>
